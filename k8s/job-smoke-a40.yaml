apiVersion: batch/v1
kind: Job
metadata:
  name: santa-smoke-a40
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: clone
        image: alpine/git
        command: ["sh","-c"]
        args:
          - git clone --depth 1 https://github.com/kevincallahan-coray/adaptive-SANTA.git /repo
        volumeMounts:
        - name: repo
          mountPath: /repo
      containers:
      - name: run
        image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
        command: ["bash","-lc"]
        args:
          - |
            set -euo pipefail
            cd /repo
            python -m pip install -q --upgrade torch --index-url https://download.pytorch.org/whl/cu128
            python -m pip install -q -r requirements.txt
            python -c "import torch; print('torch:', torch.__version__, 'cuda:', torch.version.cuda, 'gpu:', torch.cuda.get_device_name())"
            nvidia-smi
            python smoke.py --mode dense
            python smoke.py --mode fixed --fixed-s 128
            python smoke.py --mode adaptive --alpha 1.0
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        - name: HF_HOME
          value: /work/hf
        - name: TRANSFORMERS_CACHE
          value: /work/hf
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/a40: "1"
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/a40: "1"
        volumeMounts:
        - name: repo
          mountPath: /repo
        - name: work
          mountPath: /work
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: repo
        emptyDir: {}
      - name: work
        persistentVolumeClaim:
          claimName: santa-work
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
