apiVersion: batch/v1
kind: Job
metadata:
  name: santa-ruler-4k-fwe-sweep50
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["20000"]
      initContainers:
        - name: fix-work-permissions
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /work/santa-adaptive-z/data/ruler /work/santa-adaptive-z/results /work/santa-adaptive-z/hf
              chgrp -R 1000 /work/santa-adaptive-z
              chmod -R g+rwX /work/santa-adaptive-z
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/adaptive-SANTA.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /repo
              DATA=/work/santa-adaptive-z/data/ruler/4096_50/fwe/validation.jsonl
              OUT=/work/santa-adaptive-z/results/ruler_4096_fwe_50
              test -f "$DATA"
              mkdir -p "$OUT"

              python -m venv /tmp/santa-venv
              source /tmp/santa-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q torch --index-url https://download.pytorch.org/whl/cu128
              python -m pip install -q -r requirements.txt

              python -c "import torch, numpy, scipy; print('torch:', torch.__version__, 'numpy:', numpy.__version__, 'scipy:', scipy.__version__, 'gpu:', torch.cuda.get_device_name())"
              nvidia-smi

              python ruler_matrix.py \
                --dataset "$DATA" \
                --task fwe \
                --output-dir "$OUT" \
                --max-input-tokens 4096 \
                --max-examples 50 \
                --methods dense,fixed8,fixed16,fixed32,fixed64,fixed128,fixed256,adaptive0.5,adaptive1,adaptive2,adaptive4,adaptive8,adaptive16,adaptive32

              echo "=== summary.csv ==="
              cat "$OUT/summary.csv"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /work/santa-adaptive-z/hf
            - name: TRANSFORMERS_CACHE
              value: /work/santa-adaptive-z/hf
          resources:
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: work
              mountPath: /work
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: work
          persistentVolumeClaim:
            claimName: kevin-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
