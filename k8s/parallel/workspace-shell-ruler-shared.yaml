apiVersion: v1
kind: Pod
metadata:
  name: kevin-ruler-shell
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: shell
      image: ubuntu:24.04
      command: ["bash", "-lc", "sleep 86400"]
      resources:
        requests:
          cpu: "50m"
          memory: 64Mi
        limits:
          cpu: "500m"
          memory: 512Mi
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: kevin-ruler-shared
