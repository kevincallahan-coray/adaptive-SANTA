apiVersion: v1
kind: Pod
metadata:
  name: kevin-ruler-export
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: export
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "100m"
          memory: 128Mi
      volumeMounts:
        - name: shared
          mountPath: /shared
          readOnly: true
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: kevin-ruler-shared
        readOnly: true
