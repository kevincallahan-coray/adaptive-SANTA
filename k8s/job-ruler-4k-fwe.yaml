apiVersion: batch/v1
kind: Job
metadata:
  name: santa-ruler-4k-fwe
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["20000"]
      initContainers:
        - name: fix-work-permissions
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              chgrp 1000 /work || true
              chmod g+rwx /work || true
              mkdir -p /work/santa-adaptive-z/data/ruler /work/santa-adaptive-z/results /work/santa-adaptive-z/hf
              chgrp -R 1000 /work/santa-adaptive-z/data /work/santa-adaptive-z/results /work/santa-adaptive-z/hf
              chmod -R g+rwX /work/santa-adaptive-z/data /work/santa-adaptive-z/results /work/santa-adaptive-z/hf
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/adaptive-SANTA.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /repo
              test -f /work/santa-adaptive-z/data/ruler/4096/fwe/validation.jsonl
              mkdir -p /work/santa-adaptive-z/results/ruler_4096_fwe

              echo "=== storage permission check ==="
              id
              ls -ld /work /work/santa-adaptive-z/data /work/santa-adaptive-z/results
              touch /work/santa-adaptive-z/results/.write_test
              rm /work/santa-adaptive-z/results/.write_test

              python -m venv /tmp/santa-venv
              source /tmp/santa-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q torch --index-url https://download.pytorch.org/whl/cu128
              python -m pip install -q -r requirements.txt
              mkdir -p /work/santa-adaptive-z/hf

              python -c "import torch, numpy, scipy; print('torch:', torch.__version__, 'numpy:', numpy.__version__, 'scipy:', scipy.__version__, 'gpu:', torch.cuda.get_device_name())"

              python ruler_matrix.py \
                --dataset /work/santa-adaptive-z/data/ruler/4096/fwe/validation.jsonl \
                --task fwe \
                --output-dir /work/santa-adaptive-z/results/ruler_4096_fwe \
                --max-input-tokens 4096 \
                --max-examples 10 \
                --methods dense,fixed128,adaptive1

              echo "=== summary.csv ==="
              cat /work/santa-adaptive-z/results/ruler_4096_fwe/summary.csv
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /work/santa-adaptive-z/hf
            - name: TRANSFORMERS_CACHE
              value: /work/santa-adaptive-z/hf
          resources:
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: work
              mountPath: /work
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: work
          persistentVolumeClaim:
            claimName: kevin-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
