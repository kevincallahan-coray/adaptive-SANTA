apiVersion: v1
kind: Pod
metadata:
  name: kevin-workspace-shell
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: shell
      image: ubuntu:24.04
      command: ["bash", "-lc", "trap : TERM INT; sleep infinity & wait"]
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "250m"
          memory: 256Mi
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      persistentVolumeClaim:
        claimName: kevin-workspace
