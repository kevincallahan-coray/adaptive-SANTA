# Does the randomness in the systematic offset matter to benchmark accuracy?
#
# Systematic SANTA draws one u ~ U[0,1) per decode head/query and places S
# equal-mass thresholds at (j + u) * Z / S. This job runs that arm against the
# same grid anchored at a constant u = 0.5, the midpoint of every stratum.
# That second arm is not a sampler: it is the midpoint quadrature rule on the
# inverse CDF, deterministic, zero variance, error entirely bias.
#
# Both arms run in ONE pod, interleaved over the budget sweep, so they share a
# model load, a dataset, an example order and a GPU. That is what makes the
# per-example paired comparison in compare_offsets.py valid. Pairing the
# midpoint arm against the older 8192_100_instrumented run instead would
# confound the offset with everything else that differs between two jobs.
#
# SANTA_SEED reaches only the random arm; the midpoint arm consumes no rng.
# Re-run with a different seed and pass both output directories to
# compare_offsets.py to get the random arm's seed spread, which is the noise
# floor any claimed gap has to clear.
#
# Results are isolated under 8192_100_midpoint/ so the instrumented 8K results
# are neither read nor overwritten.
apiVersion: batch/v1
kind: Job
metadata:
  name: santa-ruler-8k-fwe-midpoint100
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["20000"]
                  - key: nvidia.com/gpu.compute.major
                    operator: Gt
                    values: ["7"]
      initContainers:
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - |
              set -e
              git clone --depth 1 https://github.com/kevincallahan-coray/adaptive-SANTA.git /repo
              # Print the revision, so the log says which checkout produced the
              # numbers and a stale clone is visible rather than inferred.
              git -C /repo log -1 --format='cloned %h %ad %s' --date=short
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /repo
              SEED="${SANTA_SEED:-1690}"
              DATA=/shared/ruler/data/8192_100/fwe/validation.jsonl
              OUT=/shared/ruler/results/8192_100_midpoint/fwe_seed${SEED}
              test -f "$DATA"
              mkdir -p "$OUT"
              echo "seed=$SEED out=$OUT"

              python -m venv /tmp/santa-venv
              source /tmp/santa-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q torch --index-url https://download.pytorch.org/whl/cu128
              python -m pip install -q -r requirements.txt

              python -c "import torch, numpy, scipy; print('torch:', torch.__version__, 'numpy:', numpy.__version__, 'scipy:', scipy.__version__, 'gpu:', torch.cuda.get_device_name(), 'cc:', torch.cuda.get_device_capability())"
              nvidia-smi
              python - <<'PYGPU'
              import torch
              name = torch.cuda.get_device_name(0)
              cc = torch.cuda.get_device_capability(0)
              total_gib = torch.cuda.get_device_properties(0).total_memory / (1024**3)
              bf16 = torch.cuda.is_bf16_supported()
              print(f"GPU preflight: {name}; compute={cc[0]}.{cc[1]}; VRAM={total_gib:.2f} GiB; bf16={bf16}")
              if cc[0] < 8 or not bf16:
                  raise SystemExit("This 8K BF16 SDPA run requires an Ampere-or-newer GPU (compute capability >= 8.0).")
              PYGPU

              # The pod clones from GitHub, so anything unpushed is invisible
              # here. Name the missing feature instead of failing cryptically
              # 40 minutes into a sweep.
              python - <<'PYPRE'
              import santa_backend, ruler_matrix
              if not hasattr(santa_backend.SantaConfig(), "offset"):
                  raise SystemExit("this checkout of santa_backend.py has no offset mode -- push your local changes and rerun")
              assert ruler_matrix.parse_method("fixed64-mid")[4] == "midpoint"
              print("offset preflight ok")
              PYPRE

              python ruler_matrix.py \
                --dataset "$DATA" \
                --task fwe \
                --output-dir "$OUT" \
                --max-input-tokens 8192 \
                --max-examples 100 \
                --diagnostic-sample-cap 200000 \
                --seed "$SEED" \
                --methods dense,fixed8,fixed8-mid,fixed16,fixed16-mid,fixed32,fixed32-mid,fixed64,fixed64-mid,fixed128,fixed128-mid,fixed256,fixed256-mid

              echo "=== 8K FWE midpoint-vs-random summary.csv ==="
              cat "$OUT/summary.csv"

              # Paired table in the pod log, so the headline exists before
              # anything is pulled off the PVC. It flags itself as single-seed
              # by design; a second seed is what removes that caveat.
              echo "=== 8K FWE paired offset comparison ==="
              python compare_offsets.py --results "$OUT" --out-dir "$OUT/offset_summary"
          env:
            - name: SANTA_SEED
              value: "1690"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /tmp/hf
            - name: TRANSFORMERS_CACHE
              value: /tmp/hf
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: shared
              mountPath: /shared
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: shared
          persistentVolumeClaim:
            claimName: kevin-ruler-shared
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
