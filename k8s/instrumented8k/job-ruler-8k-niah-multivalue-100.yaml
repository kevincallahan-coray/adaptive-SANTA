apiVersion: batch/v1
kind: Job
metadata:
  name: santa-ruler-8k-niah-multivalue-instrumented100
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["20000"]
                  - key: nvidia.com/gpu.compute.major
                    operator: Gt
                    values: ["7"]
      initContainers:
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/adaptive-SANTA.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /repo
              DATA=/shared/ruler/data/8192_100/niah_multivalue/validation.jsonl
              OUT=/shared/ruler/results/8192_100_instrumented/niah_multivalue
              test -f "$DATA"
              mkdir -p "$OUT"

              python -m venv /tmp/santa-venv
              source /tmp/santa-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q torch --index-url https://download.pytorch.org/whl/cu128
              python -m pip install -q -r requirements.txt

              python -c "import torch, numpy, scipy; print('torch:', torch.__version__, 'numpy:', numpy.__version__, 'scipy:', scipy.__version__, 'gpu:', torch.cuda.get_device_name(), 'cc:', torch.cuda.get_device_capability())"
              nvidia-smi
              python - <<'PYGPU'
              import torch
              name = torch.cuda.get_device_name(0)
              cc = torch.cuda.get_device_capability(0)
              total_gib = torch.cuda.get_device_properties(0).total_memory / (1024**3)
              bf16 = torch.cuda.is_bf16_supported()
              print(f"GPU preflight: {name}; compute={cc[0]}.{cc[1]}; VRAM={total_gib:.2f} GiB; bf16={bf16}")
              if cc[0] < 8 or not bf16:
                  raise SystemExit("This 8K BF16 SDPA run requires an Ampere-or-newer GPU (compute capability >= 8.0).")
              PYGPU

              python ruler_matrix.py \
                --dataset "$DATA" \
                --task niah_multivalue \
                --output-dir "$OUT" \
                --max-input-tokens 8192 \
                --max-examples 100 \
                --diagnostic-sample-cap 200000 \
                --methods dense,fixed8,fixed16,fixed32,fixed64,fixed128,fixed256,adaptive4,adaptive8,adaptive16,adaptive32

              echo "=== 8K NIAH multivalue instrumented summary.csv ==="
              cat "$OUT/summary.csv"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /tmp/hf
            - name: TRANSFORMERS_CACHE
              value: /tmp/hf
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: shared
              mountPath: /shared
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: shared
          persistentVolumeClaim:
            claimName: kevin-ruler-shared
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
