apiVersion: batch/v1
kind: Job
metadata:
  name: ruler-prepare-8k-100
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-shared-dirs
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /shared/ruler/data/8192_100 /shared/ruler/results/8192_100_instrumented
              chgrp -R 1000 /shared/ruler
              chmod -R g+rwX /shared/ruler
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: prepare
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq git ca-certificates wget >/dev/null

              python -m venv /tmp/ruler-venv
              source /tmp/ruler-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q \
                "numpy<2" "scipy>=1.11,<1.14" "transformers==4.44.2" "huggingface_hub==0.23.4" \
                nltk wonderwords tqdm pyyaml tenacity sentencepiece beautifulsoup4 html2text

              git clone --depth 1 https://github.com/NVIDIA/RULER.git /tmp/RULER

              echo "=== Downloading NIAH auxiliary text ==="
              cd /tmp/RULER/scripts/data/synthetic/json
              python download_paulgraham_essay.py
              test -s PaulGrahamEssays.json
              ls -lh PaulGrahamEssays.json

              SAVE=/shared/ruler/data/8192_100
              cd /tmp/RULER/scripts/data

              # Never accept stale output from an earlier failed preparation run.
              rm -rf "$SAVE/fwe" "$SAVE/niah_multivalue"

              for TASK in fwe niah_multivalue; do
                echo "=== Preparing 8K ${TASK} ==="
                python prepare.py \
                  --save_dir "$SAVE" \
                  --benchmark synthetic \
                  --task "$TASK" \
                  --tokenizer_path meta-llama/Meta-Llama-3.1-8B-Instruct \
                  --tokenizer_type hf \
                  --max_seq_length 8192 \
                  --model_template_type meta-llama3 \
                  --num_samples 100 \
                  --random_seed 42

                FILE="$SAVE/$TASK/validation.jsonl"
                test -s "$FILE"
                LINES=$(wc -l < "$FILE")
                echo "$TASK lines: $LINES"
                if [ "$LINES" -ne 100 ]; then
                  echo "ERROR: expected 100 rows for $TASK but found $LINES" >&2
                  exit 1
                fi
              done

              echo "=== 8K dataset files ==="
              find "$SAVE" -maxdepth 2 -type f -name '*.jsonl' -exec ls -lh {} \;
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /tmp/hf
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: kevin-ruler-shared
