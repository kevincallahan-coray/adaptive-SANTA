apiVersion: batch/v1
kind: Job
metadata:
  name: ruler-prepare-4k-fwe-50
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-work-permissions
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /work/santa-adaptive-z/data/ruler /work/santa-adaptive-z/results /work/santa-adaptive-z/hf
              chgrp -R 1000 /work/santa-adaptive-z
              chmod -R g+rwX /work/santa-adaptive-z
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: prepare
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq git ca-certificates >/dev/null
              python -m venv /tmp/ruler-venv
              source /tmp/ruler-venv/bin/activate
              python -m pip install -q --upgrade pip
              python -m pip install -q \
                "numpy<2" "scipy>=1.11,<1.14" "transformers==4.44.2" "huggingface_hub==0.23.4" \
                nltk wonderwords tqdm pyyaml tenacity sentencepiece

              git clone --depth 1 https://github.com/NVIDIA/RULER.git /tmp/RULER
              mkdir -p /work/santa-adaptive-z/data/ruler/4096_50

              cd /tmp/RULER/scripts/data
              python prepare.py \
                --save_dir /work/santa-adaptive-z/data/ruler/4096_50 \
                --benchmark synthetic \
                --task fwe \
                --tokenizer_path meta-llama/Meta-Llama-3.1-8B-Instruct \
                --tokenizer_type hf \
                --max_seq_length 4096 \
                --model_template_type meta-llama3 \
                --num_samples 50 \
                --random_seed 42

              echo "Generated:"
              wc -l /work/santa-adaptive-z/data/ruler/4096_50/fwe/validation.jsonl
              ls -lh /work/santa-adaptive-z/data/ruler/4096_50/fwe/validation.jsonl
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /work/santa-adaptive-z/hf
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: kevin-workspace
